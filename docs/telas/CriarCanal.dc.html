<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Resenha — criar canal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F13}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.chan{transition:background .15s,color .15s}
.chan:hover{background:#20232B !important;color:#ECEDEF !important}
.add{transition:background .15s,color .15s,transform .2s}
.add:hover{background:#262A33 !important;color:#ECEDEF !important;transform:rotate(90deg)}
.new{animation:newChan 1.4s ease-out both}
.backdrop{animation:fade .2s ease-out both}
.modal{animation:modalIn .32s cubic-bezier(.2,.9,.25,1.1) both}
.type{transition:box-shadow .18s,background .18s,transform .15s}
.type:hover{transform:translateY(-2px)}
.field{transition:box-shadow .18s}
.field:focus-within{box-shadow:0 0 0 2px rgba(255,107,61,.55)}
.btnp{transition:background .15s,transform .12s}
.btnp:hover{background:#FF7F57 !important}
.btnp:active{transform:scale(.97)}
.tg{appearance:none;-webkit-appearance:none;width:40px;height:24px;flex:none;margin:0;border-radius:12px;background:#3A3F4B;position:relative;cursor:pointer;transition:background .2s}
.tg::before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#ECEDEF;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.tg:checked{background:#FF6B3D}.tg:checked::before{transform:translateX(16px)}
.toast{animation:toast 2.6s ease both}
@keyframes newChan{0%{background:rgba(255,107,61,.35);transform:translateX(-8px);opacity:0}20%{transform:none;opacity:1}100%{background:transparent}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width:100%;height:900px;display:flex;background:#191B21;color:#ECEDEF;font-family:'Geist',system-ui,sans-serif;font-size:15px;overflow:hidden;position:relative">

  <nav aria-label="Suas salas" style="width:76px;flex:none;background:#0E0F13;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0">
    <span style="width:48px;height:48px;border-radius:14px;background:#FF6B3D;color:#1A0F0A;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center">R</span>
    <span style="width:48px;height:48px;border-radius:24px;background:#191B21;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center">F</span>
  </nav>

  <aside style="width:268px;flex:none;background:#14161B;display:flex;flex-direction:column">
    <header style="height:60px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid #22252D">
      <div style="font-weight:800;font-size:16px">Resenha dos amigos</div>
    </header>
    <div style="padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto">
      <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
        <div style="display:flex;align-items:center;padding:14px 8px 6px">
          <span style="flex:1;font-size:11px;font-weight:800;letter-spacing:.08em;color:#8A909C">{{sec.title}}</span>
          <button class="add" onClick="{{sec.open}}" aria-label="Criar canal de {{sec.kindName}}" title="Criar canal de {{sec.kindName}}" style="width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:#8A909C;display:flex;align-items:center;justify-content:center">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
        <sc-for list="{{sec.items}}" as="c" hint-placeholder-count="2">
          <button class="{{c.cls}}" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border:0;border-radius:10px;background:{{c.bg}};color:{{c.fg}};text-align:left;font-weight:{{c.weight}}">
            <sc-if value="{{c.isText}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width:18px;text-align:center;font-size:18px;color:#8A909C">#</span></sc-if>
            <sc-if value="{{c.isVoice}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg></sc-if>
            <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.name}}</span>
            <sc-if value="{{c.locked}}" hint-placeholder-val="{{false}}"><svg role="img" aria-label="Privado" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A909C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
          </button>
        </sc-for>
      </sc-for>
    </div>
  </aside>

  <main style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header style="height:60px;padding:0 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #22252D">
      <span aria-hidden="true" style="font-size:22px;color:#8A909C">#</span><h1 style="margin:0;font-size:17px;font-weight:800">chat</h1>
    </header>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#8A909C;font-size:14px">Clique no + de TEXTO ou VOZ na lista de canais</div>
  </main>

  <!-- Modal criar canal -->
  <sc-if value="{{open}}" hint-placeholder-val="{{true}}">
    <div class="backdrop" style="position:absolute;inset:0;background:rgba(8,9,12,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cc-title" style="width:100%;max-width:500px;border-radius:24px;background:#191B21;box-shadow:0 30px 80px -20px rgba(0,0,0,.9);display:flex;flex-direction:column;gap:18px;padding:24px">
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div style="flex:1"><h2 id="cc-title" style="margin:0;font-size:22px;font-weight:800">Criar canal</h2><p style="margin:4px 0 0;color:#A9AEB8;font-size:14px">Pode criar quantos quiser.</p></div>
          <button onClick="{{close}}" aria-label="Fechar" style="width:36px;height:36px;border:0;border-radius:10px;background:#20232B;color:#A9AEB8;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>

        <div role="radiogroup" aria-label="Tipo de canal" style="display:flex;flex-direction:column;gap:10px">
          <sc-for list="{{types}}" as="t" hint-placeholder-count="2">
            <button class="type" role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}" style="display:flex;align-items:center;gap:14px;padding:14px;border:0;border-radius:16px;background:{{t.bg}};box-shadow:{{t.ring}};text-align:left">
              <span aria-hidden="true" style="width:44px;height:44px;flex:none;border-radius:12px;background:#262A33;display:flex;align-items:center;justify-content:center;color:{{t.icon}}">
                <sc-if value="{{t.isText}}" hint-placeholder-val="{{true}}"><span style="font-size:24px;font-weight:700">#</span></sc-if>
                <sc-if value="{{t.isVoice}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"></path></svg></sc-if>
              </span>
              <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-weight:800">{{t.name}}</span><span style="font-size:13px;color:#A9AEB8">{{t.desc}}</span></span>
              <span aria-hidden="true" style="width:20px;height:20px;border-radius:50%;box-sizing:border-box;border:{{t.dot}}"></span>
            </button>
          </sc-for>
        </div>

        <label style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:700;color:#A9AEB8">Nome do canal</span>
          <span class="field" style="height:50px;border-radius:14px;background:#14161B;display:flex;align-items:center;gap:8px;padding:0 14px">
            <span aria-hidden="true" style="color:#8A909C;font-size:18px;font-weight:700">{{prefix}}</span>
            <input value="{{name}}" onInput="{{setName}}" maxlength="32" placeholder="{{placeholder}}" style="flex:1;border:0;outline:0;background:transparent;color:#ECEDEF">
          </span>
          <span style="font-size:12px;color:#8A909C">{{nameHint}}</span>
        </label>

        <label style="display:flex;align-items:center;gap:12px;cursor:pointer">
          <input class="tg" type="checkbox" checked="{{priv}}" onChange="{{flipPriv}}">
          <span style="display:flex;flex-direction:column"><span style="font-weight:700">Canal privado</span><span style="font-size:12px;color:#8A909C">Só quem tem os cargos que você escolher vê e entra.</span></span>
        </label>

        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button onClick="{{close}}" style="height:46px;padding:0 18px;border:0;border-radius:12px;background:#20232B;color:#ECEDEF;font-weight:700">Cancelar</button>
          <button class="btnp" onClick="{{create}}" aria-disabled="{{disabled}}" style="height:46px;padding:0 20px;border:0;border-radius:12px;background:#FF6B3D;color:#1A0F0A;font-weight:800;opacity:{{btnOpacity}}">Criar canal</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
    <div class="toast" role="status" style="position:absolute;left:50%;bottom:28px;padding:12px 18px;border-radius:14px;background:#ECEDEF;color:#14161B;font-weight:700;font-size:14px;z-index:6">{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      open: true, type: 'voice', name: 'Cinema', priv: false, toast: '', fresh: '',
      text: [{ name: 'chat' }, { name: 'memes' }, { name: 'atualizações' }],
      voice: [{ name: 'Resenha' }, { name: 'Jogatina' }]
    };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const s = this.state;
    const slug = (v) => v.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const finalName = s.type === 'text' ? slug(s.name) : s.name.trim();
    const mk = (list, kind) => list.map((c, i) => {
      const active = kind === 'text' && i === 0;
      const isNew = s.fresh === kind + ':' + c.name;
      return {
        name: c.name, locked: Boolean(c.priv), isText: kind === 'text', isVoice: kind === 'voice',
        cls: 'chan' + (isNew ? ' new' : ''),
        bg: active ? '#262A33' : 'transparent', fg: active ? '#ECEDEF' : '#A9AEB8', weight: active ? 700 : 500
      };
    });
    const openFor = (type) => () => this.setState({ open: true, type, name: '', priv: false });
    const types = [
      ['text', 'Texto', 'Mensagens, imagens, GIFs e enquetes. Fica salvo.'],
      ['voice', 'Voz', 'Call com voz, câmera, tela, música e vídeo junto.']
    ].map(([id, name, desc]) => {
      const on = s.type === id;
      return {
        name, desc, isText: id === 'text', isVoice: id === 'voice', checked: on ? 'true' : 'false',
        bg: on ? '#20232B' : '#14161B', ring: on ? '0 0 0 2px #FF6B3D' : '0 0 0 1px #22252D',
        icon: on ? '#FF8A62' : '#A9AEB8', dot: on ? '6px solid #FF6B3D' : '2px solid #4A4F5B',
        pick: () => this.setState({ type: id })
      };
    });
    const ok = finalName.length > 0;
    return {
      sections: [
        { title: 'TEXTO', kindName: 'texto', open: openFor('text'), items: mk(s.text, 'text') },
        { title: 'VOZ', kindName: 'voz', open: openFor('voice'), items: mk(s.voice, 'voice') }
      ],
      open: s.open, types,
      prefix: s.type === 'text' ? '#' : '',
      placeholder: s.type === 'text' ? 'novo-canal' : 'Nome da call',
      nameHint: s.type === 'text' ? (ok ? 'Vai ficar #' + finalName : 'Letras minúsculas e hífen, como #fotos-da-viagem') : 'Ex.: Cinema, Jogatina, Estudo',
      name: s.name, setName: (e) => this.setState({ name: e.target.value }),
      priv: s.priv, flipPriv: () => this.setState({ priv: !s.priv }),
      disabled: ok ? 'false' : 'true', btnOpacity: ok ? 1 : 0.45,
      close: () => this.setState({ open: false }),
      create: () => {
        if (!ok) return;
        const key = s.type;
        const entry = { name: finalName, priv: s.priv };
        clearTimeout(this.t);
        this.setState({ [key]: [...s[key], entry], open: false, fresh: key + ':' + finalName, toast: (key === 'text' ? 'Canal #' : 'Canal de voz ') + finalName + ' criado' });
        this.t = setTimeout(() => this.setState({ toast: '' }), 2600);
      },
      hasToast: Boolean(s.toast), toast: s.toast
    };
  }
}
</script>
</body>
</html>
