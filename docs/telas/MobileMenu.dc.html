<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Resenha — menu no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F13}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer}
.press{transition:transform .12s,background .15s}
.press:active{transform:scale(.95)}
.drawer{animation:slide .3s cubic-bezier(.2,.8,.2,1) both}
.wave span{display:inline-block;width:3px;height:12px;border-radius:2px;background:#3DD68C;animation:eq 1s ease-in-out infinite;transform-origin:bottom}
.wave span:nth-child(2){animation-delay:.2s}.wave span:nth-child(3){animation-delay:.4s}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;background:#0E0F13;color:#ECEDEF;font-family:{{font}};font-size:15px;overflow:hidden">
  <nav aria-label="Salas" style="width:72px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0">
    <a href="MobileDMs.dc.html" aria-label="Mensagens" style="width:48px;height:48px;border-radius:24px;background:#191B21;color:#ECEDEF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg></a>
    <span style="width:28px;height:2px;border-radius:2px;background:#262A33"></span>
    <sc-for list="{{rooms}}" as="r" hint-placeholder-count="4">
      <button class="press" onClick="{{r.pick}}" aria-label="{{r.name}}" aria-current="{{r.current}}" style="width:48px;height:48px;border:0;border-radius:{{r.radius}};background:{{r.bg}};color:{{r.fg}};font-weight:800;font-size:18px">{{r.initial}}</button>
    </sc-for>
    <span style="width:48px;height:48px;border-radius:24px;border:1px dashed #6A707C;color:#A9AEB8;display:flex;align-items:center;justify-content:center;box-sizing:border-box">+</span>
    <div style="flex:1"></div>
    <a href="MobileLoja.dc.html" aria-label="Loja" style="width:48px;height:48px;border-radius:24px;background:#191B21;color:#FFB091;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H4l1.5 12.5a2 2 0 0 0 2 1.5h9a2 2 0 0 0 2-1.5z"/><path d="M8 7V6a4 4 0 0 1 8 0v1"/></svg></a>
  </nav>
  <div class="drawer" style="flex:1;min-width:0;margin:10px 10px 10px 0;border-radius:22px;background:#14161B;display:flex;flex-direction:column;overflow:hidden">
    <header style="padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #22252D">
      <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{roomName}}</div><div style="font-size:12px;color:#8A909C">4 online · 7 membros</div></div>
      <a href="SalaConfig.dc.html" aria-label="Configurações da sala" style="width:40px;height:40px;border-radius:12px;background:#20232B;color:#ECEDEF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></a>
    </header>
    <div style="flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:4px">
      <div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:#8A909C;padding:4px 8px">TEXTO</div>
      <a href="Mobile.dc.html" style="height:46px;padding:0 12px;border-radius:12px;background:#262A33;color:#ECEDEF;display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700"><span style="color:#8A909C">≡</span><span style="flex:1">chat</span><span style="font-size:11px;font-weight:800;color:#1A0F0A;background:#FF6B3D;border-radius:8px;padding:1px 7px">3</span></a>
      <a href="Mobile.dc.html" style="height:46px;padding:0 12px;border-radius:12px;color:#A9AEB8;display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700"><span style="color:#8A909C">≡</span>memes</a>
      <div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:#8A909C;padding:14px 8px 4px">VOZ</div>
      <a href="MobileCall.dc.html" style="padding:12px;border-radius:16px;background:#20232B;color:#ECEDEF;text-decoration:none;display:flex;flex-direction:column;gap:10px">
        <span style="display:flex;align-items:center;gap:8px"><span class="wave" aria-hidden="true" style="display:inline-flex;align-items:flex-end;gap:2px;height:12px"><span></span><span></span><span></span></span><span style="flex:1;font-weight:800">Resenha</span><span style="font-size:10px;font-weight:800;color:#fff;background:#E5484D;border-radius:5px;padding:2px 6px">3 AO VIVO</span></span>
        <span style="display:flex;align-items:center"><span style="width:28px;height:28px;border-radius:50%;background:#F2A65A;border:2px solid #20232B"></span><span style="width:28px;height:28px;border-radius:50%;background:#8BD3A8;border:2px solid #20232B;margin-left:-8px"></span><span style="width:28px;height:28px;border-radius:50%;background:#C9A7F5;border:2px solid #20232B;margin-left:-8px"></span><span style="margin-left:auto;height:34px;padding:0 14px;border-radius:10px;background:#FF6B3D;color:#1A0F0A;font-weight:800;font-size:13px;display:flex;align-items:center">Entrar</span></span>
      </a>
      <span style="height:46px;padding:0 12px;border-radius:12px;color:#A9AEB8;display:flex;align-items:center;gap:10px;font-weight:700"><span>◖</span><span style="flex:1">Jogatina</span><span style="font-size:12px;color:#8A909C">vazio</span></span>
    </div>
    <footer style="padding:12px 14px;background:#101216;display:flex;align-items:center;gap:10px">
      <span style="position:relative;width:38px;height:38px;border-radius:50%;background:#7FB2F0;color:#14161B;font-weight:800;display:flex;align-items:center;justify-content:center">F<span style="position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#3DD68C;border:3px solid #101216"></span></span>
      <span style="flex:1"><span style="display:block;font-weight:700">Felipe</span><span style="font-size:12px;color:#8A909C">Online</span></span>
      <a href="Config.dc.html" aria-label="Configurações" style="width:40px;height:40px;border-radius:12px;color:#A9AEB8;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></a>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"font":{"editor":"enum","options":["Geist","Plus Jakarta Sans","Outfit","Sora","DM Sans","Inter"],"default":"Geist","section":"Tipografia"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { room: 0 }; }
  renderVals() {
    const s = this.state;
    const font = "'" + (this.props.font ?? 'Geist') + "',system-ui,sans-serif";
    const names = ['Resenha dos amigos', 'Futebol de quinta', 'Jogatina', 'Pagode de domingo'];
    const rooms = names.map((name, i) => ({ name, initial: name.charAt(0), current: s.room === i ? 'page' : 'false', radius: s.room === i ? '14px' : '24px', bg: s.room === i ? '#FF6B3D' : '#191B21', fg: s.room === i ? '#1A0F0A' : '#ECEDEF', pick: () => this.setState({ room: i }) }));
    return { font, rooms, roomName: names[s.room] };
  }
}
</script>
</body>
</html>
