<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Resenha — entrar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Outfit:wght@400;500;600;700;800&amp;family=Sora:wght@400;500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F13}
a{color:#FF8A62}a:hover{color:#FFB091}
button{font:inherit;color:inherit;cursor:pointer}
.card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.fieldbox{transition:box-shadow .18s,background .18s}
.fieldbox:focus-within{box-shadow:0 0 0 2px rgba(255,107,61,.55);background:#1D2027 !important}
.btnp{transition:background .15s,transform .12s,box-shadow .2s}
.btnp:hover{background:#FF7F57 !important;box-shadow:0 10px 28px -10px rgba(255,107,61,.75)}
.btnp:active{transform:scale(.98)}
.ghost:hover{background:#262A33 !important}
.bubble{animation:float 6s ease-in-out infinite}
.bubble.b2{animation-delay:-2s}.bubble.b3{animation-delay:-4s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (max-width:900px){.hide-sm{display:none !important}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width:100%;min-height:900px;display:flex;flex-wrap:wrap;background:#0E0F13;color:#ECEDEF;font-family:{{font}};font-size:15px">

  <!-- Lado da marca -->
  <section class="hide-sm" style="flex:1 1 560px;min-height:900px;box-sizing:border-box;padding:56px;display:flex;flex-direction:column;justify-content:space-between;background:#14161B">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="width:44px;height:44px;border-radius:14px;background:#FF6B3D;color:#1A0F0A;display:flex;align-items:center;justify-content:center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>
      </span>
      <span style="letter-spacing:-.02em;font-weight:700;font-size:22px">Resenha</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;max-width:440px" aria-hidden="true">
      <div class="bubble" style="align-self:flex-start;display:flex;gap:10px;align-items:flex-end">
        <span style="width:34px;height:34px;border-radius:50%;background:#F2A65A;color:#14161B;font-weight:800;display:flex;align-items:center;justify-content:center">B</span>
        <span style="padding:12px 16px;border-radius:18px 18px 18px 6px;background:#20232B">Call hoje às 22h?</span>
      </div>
      <div class="bubble b2" style="align-self:flex-end;display:flex;gap:10px;align-items:flex-end">
        <span style="padding:12px 16px;border-radius:18px 18px 6px 18px;background:#FF6B3D;color:#1A0F0A;font-weight:700">Bora! Já tô entrando</span>
      </div>
      <div class="bubble b3" style="align-self:flex-start;display:flex;gap:10px;align-items:flex-end">
        <span style="width:34px;height:34px;border-radius:50%;background:#8BD3A8;color:#14161B;font-weight:800;display:flex;align-items:center;justify-content:center">C</span>
        <span style="padding:12px 16px;border-radius:18px 18px 18px 6px;background:#20232B">Transmito o jogo depois</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <h2 style="margin:0;letter-spacing:-.02em;font-size:44px;line-height:1.05;font-weight:700;max-width:480px">Sua galera, uma sala só.</h2>
      <p style="margin:0;color:#A9AEB8;max-width:440px;line-height:1.55">Chat que fica salvo, call com voz, câmera e tela, e um sorteador que ninguém consegue roubar.</p>
    </div>
  </section>

  <!-- Formulário -->
  <section style="flex:1 1 420px;min-height:900px;display:flex;align-items:center;justify-content:center;padding:32px 16px;box-sizing:border-box">
    <div class="card" style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:22px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <h1 style="margin:0;letter-spacing:-.02em;font-size:30px;font-weight:700">Bem-vindo de volta</h1>
        <p style="margin:0;color:#A9AEB8">Entre para ver suas salas.</p>
      </div>

      <button class="ghost" style="height:50px;border:1px solid #2A2E38;border-radius:14px;background:#14161B;color:#ECEDEF;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path fill="#ECEDEF" d="M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.2zM12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22zM6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14zM12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z"/></svg>
        Entrar com Google
      </button>

      <div style="display:flex;align-items:center;gap:12px;color:#8A909C;font-size:12px;font-weight:700"><span style="flex:1;height:1px;background:#262A33"></span>OU COM E-MAIL<span style="flex:1;height:1px;background:#262A33"></span></div>

      <form style="display:flex;flex-direction:column;gap:14px">
        <label style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:700;color:#A9AEB8">E-mail</span>
          <span class="fieldbox" style="height:50px;border-radius:14px;background:#191B21;display:flex;align-items:center;padding:0 14px">
            <input type="email" placeholder="voce@email.com" autocomplete="email" style="flex:1;border:0;outline:0;background:transparent;color:#ECEDEF;font:inherit">
          </span>
        </label>
        <label style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:700;color:#A9AEB8;display:flex;justify-content:space-between">Senha <a href="#esqueci" style="font-weight:700">Esqueceu?</a></span>
          <span class="fieldbox" style="height:50px;border-radius:14px;background:#191B21;display:flex;align-items:center;padding:0 6px 0 14px;gap:6px">
            <input type="password" placeholder="Pelo menos 6 caracteres" autocomplete="current-password" style="flex:1;border:0;outline:0;background:transparent;color:#ECEDEF;font:inherit">
            <button type="button" class="ghost" aria-label="Mostrar senha" style="width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:#A9AEB8;display:flex;align-items:center;justify-content:center">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </span>
        </label>
        <button type="submit" class="btnp" style="height:52px;margin-top:6px;border:0;border-radius:14px;background:#FF6B3D;color:#1A0F0A;font-weight:800;font-size:16px">Entrar</button>
      </form>

      <p style="margin:0;text-align:center;color:#A9AEB8;font-size:14px">Ainda não tem conta? <a href="#criar" style="font-weight:700">Criar conta</a></p>

      <button class="ghost" style="height:44px;border:0;border-radius:12px;background:transparent;color:#A9AEB8;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        Instalar o app no PC
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"font":{"editor":"enum","options":["Geist","Plus Jakarta Sans","Outfit","Sora","DM Sans","Inter"],"default":"Geist","section":"Tipografia"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { font: "'" + (this.props.font ?? 'Geist') + "',system-ui,sans-serif" }; }
}
</script>
</body>
</html>
