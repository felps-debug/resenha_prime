<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Resenha — call no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F13}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer}
.press{transition:transform .12s,background .15s}
.press:active{transform:scale(.93)}
.swap{animation:swap .3s cubic-bezier(.2,.8,.2,1) both}
.speak{box-shadow:0 0 0 2px #0E0F13,0 0 0 4px #3DD68C}
@keyframes swap{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#0E0F13;color:#ECEDEF;font-family:{{font}};font-size:15px;overflow:hidden">
  <header style="flex:none;padding:14px 12px 10px;display:flex;align-items:center;gap:10px">
    <a href="Mobile.dc.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:12px;background:#191B21;color:#ECEDEF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="flex:1"><div style="font-weight:800">Resenha · voz</div><div style="font-size:12px;color:#8A909C">4 na call · 3 transmitindo</div></div>
    <button class="press" onClick="{{toggleChat}}" aria-pressed="{{chatPressed}}" aria-label="Chat da call" style="width:44px;height:44px;border:0;border-radius:12px;background:{{chatBg}};color:#ECEDEF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg></button>
  </header>

  <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:0 12px">
    <div class="swap" style="position:relative;flex:1;min-height:0;border-radius:20px;background:{{cur.bg}};display:flex;align-items:center;justify-content:center">
      <span style="color:{{cur.accent}};font-weight:800">{{curTitle}}</span>
      <span style="position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;background:rgba(14,15,19,.8);font-size:12px;font-weight:700"><span style="width:6px;height:6px;border-radius:50%;background:#FF8A62"></span><span>{{curLabel}}</span></span>
      <div style="position:absolute;right:10px;top:10px;display:flex;gap:6px">
        <button class="press" aria-label="Tela cheia (deita o celular)" style="width:40px;height:40px;border:0;border-radius:10px;background:rgba(14,15,19,.82);color:#ECEDEF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      </div>
      <button class="press" onClick="{{prev}}" aria-label="Tela anterior" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:rgba(14,15,19,.7);color:#ECEDEF">‹</button>
      <button class="press" onClick="{{next}}" aria-label="Próxima tela" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:rgba(14,15,19,.7);color:#ECEDEF">›</button>
    </div>
    <div style="display:flex;justify-content:center;gap:6px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="width:{{d.w}};height:6px;border-radius:3px;background:{{d.c}};transition:width .2s"></span></sc-for>
    </div>
    <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
        <div style="flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:6px">
          <span class="{{p.cls}}" style="width:52px;height:52px;border-radius:50%;background:{{p.color}};color:#14161B;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center">{{p.initial}}</span>
          <span style="font-size:12px;color:#A9AEB8">{{p.name}}</span>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{showChat}}" hint-placeholder-val="{{false}}">
      <div class="swap" style="padding:10px;border-radius:16px;background:#14161B;display:flex;flex-direction:column;gap:8px">
        <div style="font-size:13px"><strong>Bia</strong> <span style="color:#DADCE0">passa pra tela do Caio rápido</span></div>
        <div style="font-size:13px"><strong>Caio</strong> <span style="color:#DADCE0">tô de clutch, olha</span></div>
        <label style="display:flex;height:40px;padding:0 12px;border-radius:12px;background:#20232B;align-items:center"><span style="position:absolute;width:1px;height:1px;overflow:hidden">Mensagem na call</span><input placeholder="Mensagem na call" style="flex:1;border:0;outline:0;background:transparent;color:#ECEDEF;font:inherit;font-size:16px"></label>
      </div>
    </sc-if>
  </div>

  <div style="flex:none;display:flex;justify-content:space-around;padding:12px 12px 22px">
    <button class="press" aria-label="Microfone" style="width:56px;height:56px;border:0;border-radius:18px;background:#262A33;color:#ECEDEF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></button>
    <button class="press" aria-label="Câmera" style="width:56px;height:56px;border:0;border-radius:18px;background:#262A33;color:#ECEDEF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg></button>
    <button class="press" aria-label="Alto-falante" style="width:56px;height:56px;border:0;border-radius:18px;background:#262A33;color:#ECEDEF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
    <a href="Mobile.dc.html" aria-label="Sair da call" style="width:56px;height:56px;border-radius:18px;background:#E5484D;color:#fff;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.5 13 13 0 0 0 2.8.7 2 2 0 0 1 1.7 2V20a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3.2a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9"/><path d="M22 2 2 22"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"font":{"editor":"enum","options":["Geist","Plus Jakarta Sans","Outfit","Sora","DM Sans","Inter"],"default":"Geist","section":"Tipografia"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0, chat: false }; }
  renderVals() {
    const s = this.state;
    const font = "'" + (this.props.font ?? 'Geist') + "',system-ui,sans-serif";
    const screens = [{ name: 'Caio', bg: '#16202C', accent: '#7FB2F0' }, { name: 'Bia', bg: '#1E1A2B', accent: '#C9A7F5' }, { name: 'Duda', bg: '#2A1E17', accent: '#F2A65A' }];
    const n = screens.length;
    const people = [['Bia', '#F2A65A', true], ['Caio', '#8BD3A8'], ['Duda', '#C9A7F5'], ['Você', '#7FB2F0']].map(([name, color, sp]) => ({ name, color, initial: name.charAt(0), cls: sp ? 'speak' : '' }));
    return {
      font, people, cur: screens[s.i],
      curTitle: '[Tela de ' + screens[s.i].name + ']', curLabel: screens[s.i].name + ' · ' + (s.i + 1) + ' de ' + n,
      dots: screens.map((_, j) => ({ w: j === s.i ? '18px' : '6px', c: j === s.i ? '#FF6B3D' : '#3A3F4B' })),
      prev: () => this.setState({ i: (s.i - 1 + n) % n }), next: () => this.setState({ i: (s.i + 1) % n }),
      showChat: s.chat, chatPressed: s.chat ? 'true' : 'false', chatBg: s.chat ? '#262A33' : '#191B21',
      toggleChat: () => this.setState({ chat: !s.chat })
    };
  }
}
</script>
</body>
</html>
