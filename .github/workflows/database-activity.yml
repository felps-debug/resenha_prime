name: Verificar disponibilidade do banco

on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Consultar o banco com a chave publicável
        shell: bash
        run: |
          set -eu
          if [[ ! "$SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co$ ]] || [[ -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo 'Configure SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY nas variáveis do repositório.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 15 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/rooms?select=id&limit=1" >/dev/null
